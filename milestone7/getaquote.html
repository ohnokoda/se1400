<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="background-color: rgba(12,116,124,0.8); height: auto; padding: 10px; text-align: center;">Get A Quote</h1> 
    
    <div id="header">
        <nav id="nav">
            <ul style="display:grid; justify-content: space-around; padding: 20px; background-color:rgba(12,116,124,0.8);grid-template-columns: repeat(4, auto);">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="getaquote.html">Get A Quote</a></li>
                <li><a href="contactus.html">Contact Us</a></li>
            </ul>
        </nav>
    </div>

    <div style="text-align: center; margin: 2.0rem;">
        <button style='padding: 10px 20px; cursor: pointer;'>Get A Quote</button>
    </div>

    <main>
        <section id="quote">
            <h2 style="font-family: Georgia, 'Times New Roman', Times, serif; text-align: center; padding: 2rem;"> 
             Get a quote today!
            </h2>
             <form action="/apply" method="post" style="font-family: Georgia, 'Times New Roman', Times, serif;">

                <fieldset>
                    <legend>Personal Information</legend>

                    <div class="form">
                        <label for="first-name">First Name</label>
                        <input type="text"
                               required
                        
                    </div>
                

                    <div class="form">
                        <label for="last-name">Last Name</label>
                        <input type="text" 
                               required>
                    </div>
                    <div class="form">
                        <label for="Company-Name">Company Name</label>
                        <input type="text" 
                    </div>

                    <div class="form">
                        <label for="email">Email Address</label>
                        <input type="email"
                               required>
                    </div>

                    <div class="form">
                        <label for="phone">Phone Number</label>
                        <input type="tel" 
                               pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                               title="Format: 555-555-5555"
                               required>
                    </div>
                </fieldset>

                    <fieldset>
                    <legend>Reason for Quote, Please Check One</legend>
                    <label><input type="radio" name="quote" value="Roof-Repair"> Roof Repair</label>
                    <label><input type="radio" name="quote" value="Roof-Inspection"> Roof Inspection</label>
                    <label><input type="radio" name="quote" value="Construction-Needs"> Construction Needs</label>
                    <label><input type="radio" name="quote" value="Other"> Other</label>
                    
                </fieldset>

                    <div class="form">
                        <label for="start">Please pick a date that would work best for you, and we will reach out with closest available appointment!</label>
                        <input type="date"
                               min="2026-05-01" max="2028-01-01">
                    </div>

                    <div class="form">
                        <label for="referral">How did you hear about Flashpoint?</label>
                        <input type="text" 
                             
                               placeholder="Type an option...">
                        <datalist id="referral">
                        </datalist>
                    </div>
                </fieldset>

                <div class="form">
                    <label for="Additional-info">Any additional information you would like to provide our team...</label>
                    <textarea  rows="3"
                              placeholder="Additional Information..."></textarea>
                </div>

               <div style="display: flex; justify-content: center; margin: 2.0rem;">
  <button type="submit">Submit Application</button>
</div>
            </form>
        </section>

    </main>
<footer></footer>

</body>
</html>
